[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-calibration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "terraforming[gcm3d]==0.1.0",
  "jax[cuda12]==0.11.0; sys_platform == 'linux'",
  "jax==0.11.0; sys_platform != 'linux'",
  "numpy==2.4.2",
  "scipy==1.18.0",
  "xarray==2026.7.0",
]

[project.scripts]
mars-calibration = "mars_calibration.launch:main"

[tool.setuptools.packages.find]
include = ["mars_calibration*"]
