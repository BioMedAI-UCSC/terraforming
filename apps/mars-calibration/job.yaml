apiVersion: batch/v1
kind: Job
metadata:
  name: mars-short-calibration
  labels:
    app.kubernetes.io/name: mars-calibration
    app.kubernetes.io/component: short-horizon-calibration
spec:
  # Retry node/preemption failures. Each pod writes to its own result directory.
  backoffLimit: 2
  activeDeadlineSeconds: 86400
  podFailurePolicy:
    rules:
      # Exit 10 means the experiment completed but missed its declared
      # scientific acceptance criteria. Repeating identical work will not help.
      - action: FailJob
        onExitCodes:
          containerName: calibration
          operator: In
          values: [10]
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mars-calibration
        app.kubernetes.io/component: short-horizon-calibration
    spec:
      restartPolicy: Never
      # A100 quota is zero by default. Opportunistic bypasses that quota, but the
      # pod can be preempted. Remove this field after an A100 quota is approved.
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # rook-ceph-block is in US West; colocating compute avoids
                  # unnecessary cross-region storage latency.
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: [us-west]
                  # JAX's CUDA 12 wheel requires a CUDA-12-capable driver.
                  - key: nvidia.com/cuda.driver.major
                    operator: Gt
                    values: ["524"]
      containers:
        - name: calibration
          # Replace with your pushed linux/amd64 image, preferably pinned by digest.
          image: YOUR_REGISTRY/mars-calibration:short-horizon
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - >-
              exec mars-calibration
              --config /opt/application/experiment.json
              --inputs /inputs
              --output "/results/calibration-${POD_NAME}"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 2Gi
              nvidia.com/a100: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              ephemeral-storage: 8Gi
              nvidia.com/a100: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /inputs
              subPath: inputs
              readOnly: true
            - name: data
              mountPath: /results
              subPath: results
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mars-calibration-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
