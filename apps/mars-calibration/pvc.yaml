apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mars-calibration-data
spec:
  # NRP recommends RBD for a volume mounted by one pod at a time. The transfer
  # pod must be deleted before the GPU Job starts.
  storageClassName: rook-ceph-block
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
