apiVersion: v1
kind: Pod
metadata:
  name: paper-results
  namespace: razvanlab
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: results
      image: busybox:1.37.0
      command: [sleep, "86400"]
      resources:
        requests: {cpu: "1", memory: 1Gi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: work
          mountPath: /work
          readOnly: true
  volumes:
    - name: work
      persistentVolumeClaim:
        claimName: paper-experiments
