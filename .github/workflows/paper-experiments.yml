name: Nautalis experiment runtime
on:
  pull_request:
    paths: ['apps/nautalis/**', 'iclr_experiments/**', '.github/workflows/paper-experiments.yml']
  push:
    branches: [main]
    paths: ['apps/nautalis/**', 'iclr_experiments/**', '.github/workflows/paper-experiments.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python apps/nautalis/test_runtime.py
      - run: python iclr_experiments/test_runtime.py
