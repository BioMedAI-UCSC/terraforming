name: gcm3d (dinosaur)

# Focused CI for the JAX GCM and its current framework/Mars integration paths.
# Install the locked optional extra explicitly so collection cannot silently
# skip the numerical regressions or use a different JAX version than uv.lock.
on:
  pull_request:
    paths:
      - "package/src/framework/gcm/**"
      - "package/src/framework/physics/**"
      - "package/src/celestials/planets/mars/**"
      - "package/tests/gcm3d/**"
      - "apps/mars-calibration/**"
      - "examples/neural/**"
      - "scripts/run_differentiable_experiments.py"
      - "scripts/paper_calibration.py"
      - "scripts/audit_paper_results.py"
      - "scripts/run_scalar_sensitivity.py"
      - "package/pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gcm3d.yml"
  workflow_dispatch:

concurrency:
  group: gcm3d-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gcm3d-shards:
    name: gcm3d shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace + gcm3d extra (dinosaur + jax)
        run: uv sync --dev --all-packages --extra gcm3d

      - name: gcm3d tests
        working-directory: package
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          uv run --no-sync python - <<'PYTEST'
          import os
          import subprocess
          import sys
          command = [sys.executable, "-m", "pytest"]
          collection = subprocess.run(
              [*command, "tests/gcm3d/", "--collect-only", "-q", "-m", "not slow"],
              check=True, capture_output=True, text=True,
          )
          nodes = [line for line in collection.stdout.splitlines()
                   if line.startswith("tests/gcm3d/") and "::" in line]
          assert nodes and len(nodes) == len(set(nodes)), collection.stdout
          count = int(os.environ["SHARD_COUNT"])
          shards = [nodes[index::count] for index in range(count)]
          assert sorted(node for shard in shards for node in shard) == sorted(nodes)
          selected = shards[int(os.environ["SHARD_INDEX"])]
          assert selected
          subprocess.run([*command, "-v", *selected], check=True)
          PYTEST

      - name: Calibration application regressions
        if: matrix.shard == 0
        env:
          PYTHONPATH: package:.
        run: uv run --no-sync python -m pytest -c package/pyproject.toml apps/mars-calibration/tests -v -m "not slow"

  gcm3d-tests:
    runs-on: ubuntu-latest
    needs: gcm3d-shards
    if: always()
    steps:
      - name: Require every test shard
        env:
          SHARD_RESULT: ${{ needs.gcm3d-shards.result }}
        run: test "$SHARD_RESULT" = success
