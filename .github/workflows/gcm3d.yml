name: gcm3d (dinosaur)

# Focused CI for the JAX GCM and its current framework/Mars integration paths.
# Install the locked optional extra explicitly so collection cannot silently
# skip the numerical regressions or use a different JAX version than uv.lock.
on:
  pull_request:
    paths:
      - "package/src/framework/gcm/**"
      - "package/src/framework/physics/**"
      - "package/src/celestials/planets/mars/**"
      - "package/tests/gcm3d/**"
      - "apps/mars-calibration/**"
      - "examples/neural/**"
      - "package/pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gcm3d.yml"
  workflow_dispatch:

concurrency:
  group: gcm3d-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gcm3d-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace + gcm3d extra (dinosaur + jax)
        run: uv sync --dev --all-packages --extra gcm3d

      - name: gcm3d tests
        working-directory: package
        run: uv run --no-sync python -m pytest tests/gcm3d/ -v -m "not slow"

      - name: Calibration application regressions
        env:
          PYTHONPATH: package:.
        run: uv run --no-sync python -m pytest -c package/pyproject.toml apps/mars-calibration/tests -v -m "not slow"
