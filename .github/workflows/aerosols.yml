name: Aerosol interventions

on:
  pull_request:
    paths:
      - 'package/src/interventions/**'
      - 'package/tests/gcm3d/test_aerosol*'
      - 'package/src/framework/physics/**'
      - 'package/pyproject.toml'
      - '.github/workflows/aerosols.yml'
      - 'cli/**'
      - 'ui/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aerosol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev --all-packages --extra gcm3d
      - name: Material, transport, radiation and experiment checks
        env:
          PYTHONPATH: package:.
        run: uv run --no-sync python -m pytest -c package/pyproject.toml package/tests/gcm3d/test_aerosol* -m 'not slow' -q
      - name: CLI and server aerosol checks
        env:
          PYTHONPATH: package:.
          MPLBACKEND: Agg
        run: uv run --no-sync python -m pytest cli/tests/test_aerosols.py -q
  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - name: Save the built server UI
        uses: actions/upload-artifact@v4
        with:
          name: aerosol-ui
          path: cli/static/
          retention-days: 7
