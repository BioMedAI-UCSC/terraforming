site_name: Terraforming · Mars GCM
site_description: Differentiable three-dimensional Mars climate model — dynamics, physics, calibration and neural experiments
repo_url: https://github.com/BioMedAI-UCSC/terraforming
repo_name: BioMedAI-UCSC/terraforming
edit_uri: edit/main/docs/

validation:
  links:
    anchors: warn

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.integrate
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [package]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/mars.css

nav:
  - 3-D GCM:
      - Start here: index.md
      - Model overview: package/gcm3d/README.md
      - Python quickstart: package/gcm3d/quickstart.md
      - Implementation & physics: package/gcm3d/implementation.md
      - Calibration & ablations: package/gcm3d/calibration.md
      - Neural experiments: package/gcm3d/neural-experiments.md
      - Temperature-only postprocessing: package/gcm3d/temperature-only.md
      - Differentiable experiment runbook: differentiable-experiments.md
      - Temperature-only runbook: neural-temp-only-runbook.md
      - Data & validation scripts: scripts/gcm3d-data.md
      - Validation & limitations: package/gcm3d/validation.md
      - Physics ledger: ideas/gcm3d-physics-limitations.md
  - Getting Started:
      - What is tform?: getting-started/what-is-tform.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Architecture:
      - GCM system: architecture/planet.md
      - Mars configuration: architecture/mars.md
      - Component architecture: package/gcm3d/architecture.md
      - Design philosophy: package/gcm3d/philosophy.md
      - Browser visualizer: architecture/visualizer.md
  - API Reference:
      - GCM interfaces: package/gcm3d/api.md
      - Framework: api/framework.md
      - Mars: api/celestials.md
  - CLI & Comparisons:
      - Commands: cli/commands.md
      - Reference comparisons: cli/reference-comparison.md
  - Wiki:
      - Orbital Mechanics: wiki/orbital-mechanics.md
      - Solar Radiation: wiki/solar-radiation.md
      - Greenhouse Effect: wiki/greenhouse-effect.md
      - Mars:
          - Overview: wiki/mars/index.md
          - Solar Flux Model: wiki/mars/solar-flux.md
          - Climate Model: wiki/mars/climate-model.md
  - Deprecated global-mean model:
      - Deprecation and migration: deprecated-global-mean.md
      - Torch planet architecture: architecture/global-mean-planet.md
      - Torch Mars derivation: architecture/global-mean-mars.md
      - Archived climate notes: wiki/mars/global-mean-climate-model.md
      - Global-mean presets: cli/presets.md
      - Global-mean engine: api/engine.md
      - Intervention architecture: architecture/interventions.md
      - Intervention API: api/interventions.md
      - GHG intervention theory: wiki/mars/interventions.md
