[project]
name = "terraforming-cli"
version = "0.1.0"
description = "tform — interactive CLI for Mars climate simulation"
readme = {text = "Command line and web interface for Mars climate and aerosol screening experiments.", content-type = "text/plain"}
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "terraforming>=0.1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
tform = "cli.main:cli"

[tool.uv.sources]
terraforming = { workspace = true }

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cli"]
package-dir = {cli = "."}

[tool.setuptools.package-data]
cli = ["configs/*.yaml", "configs/*.json", "static/*.html", "static/assets/*"]
